apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-deployment
  labels:
    name: sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sandbox-server
    spec:
      serviceAccountName: resource-manager
      containers:
        - image: sandbox:latest
          imagePullPolicy: IfNotPresent
          name: main-sandbox-container
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_URL
            - name:  SANDBOX_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name:  database-secrets
                  key:  SANDBOX
            - name:  JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name:  jwt-secrets
                  key:  JWT_SECRET
          resources:
            limits:
              cpu: "500m"
              memory: "400Mi"
            requests:
              cpu: "250m"
              memory: "200Mi"
          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          ports:
            - containerPort: 3000
              name: main-sandbox
