apiVersion: apps/v1
kind: Deployment
metadata:
  name:  notification-deployment
  labels:
    name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - image:  notification
        imagePullPolicy: IfNotPresent
        name:  notification-server
        resources:
          requests:
            cpu: "150m"
            memory: "100M"
          limits:
            cpu: "300m"
            memory: "200M"
        livenessProbe:
          httpGet:
            path: /status/health
            port: 4000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /status/ready
            port: 4000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name:  email-secrets
              key:  EMAIL_USER   
        - name: GOOGLE_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name:  token-secrets
              key:  GOOGLE_REFRESH_TOKEN
        - name:  GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name:  google-secrets
              key:  GOOGLE_CLIENT_ID
        - name:  GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name:  google-secrets
              key:  GOOGLE_CLIENT_SECRET 
        - name:  RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name:  rabbitmq-secrets
              key:  RABBITMQ_URL 
        ports:
        - containerPort:  4000
          name:  my-name